name: "Bug"
description: "Have you encountered a bug?"
labels: ["bug", "0 - to triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 👍 Thanks for reporting a bug in Tasks Board!
        Tasks Board is a fork of [Nextcloud Tasks](https://github.com/nextcloud/tasks). If the problem also occurs in the Tasks app, please report it [there](https://github.com/nextcloud/tasks/issues).
        Everything that is related to the CalDAV server, meaning it does not only affect the web app but also your mobile and desktop clients, belongs in [the Nextcloud server repository](https://github.com/nextcloud/server).

        Please do not report security issues here. Report them privately on GitHub instead (tab "Security" → "Report a vulnerability").

        To make it possible to help you, please fill out the information below carefully.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Describe the steps to reproduce the bug.
        The better your description is _(go 'here', click 'there'…)_ the fastest you'll get an _(accurate)_ answer.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Tell us what should happen
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behaviour
      description: |
        Tell us what happens instead
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## Tasks Board"
  - type: input
    id: tasks-app-version
    attributes:
      label: Tasks Board version
      description: |
        See apps admin page, e.g. 1.0.0
  - type: input
    id: CalDAV-clients-used
    attributes:
      label: CalDAV-clients used
      description: e.g. Thunderbird Lightning, DAVx5, Evolution, macOS Calendar, etc...
  - type: markdown
    attributes:
      value: "## Client configuration"
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g Firefox 117
  - type: input
    id: client-os
    attributes:
      label: Client operating system
      description: e.g. Arch Linux
  - type: markdown
    attributes:
      value: "## Server configuration"
  - type: input
    id: server-os
    attributes:
      label: Server operating system
      description: e.g. Arch Linux
  - type: dropdown
    id: webserver
    attributes:
      label: Web server
      description: |
        Select Webserver serving Nextcloud Server.
        _Describe in the "Additional info" section if you chose "Other"._
      options:
        - "Apache"
        - "Nginx"
        - "Other"
  - type: dropdown
    id: database
    attributes:
      label: Database engine version
      description: |
        Select Database engine serving Nextcloud Server.
        _Describe in the "Additional info" section if you chose "Other"._
      options:
        - "MySQL"
        - "MariaDB"
        - "PostgreSQL"
        - "SQlite"
        - "Oracle"
        - "Other"
  - type: dropdown
    id: php
    attributes:
      label: PHP engine version
      description: |
        Select PHP engine version serving Nextcloud Server.
        _Describe in the "Additional info" section if you chose "Other"._
      options:
        - "PHP 8.0"
        - "PHP 8.1"
        - "PHP 8.2"
        - "Other"
  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud version
      description: see admin page, e.g. 27.0.0
  - type: dropdown
    id: fresh-install-update
    attributes:
      label: Updated from an older installed version or fresh install
      options:
        - "Updated from an older version"
        - "Fresh install"
  - type: textarea
    id: list-active-apps
    attributes:
      label: List of activated apps
      description: |
        If you have access to your command line run e.g.:
        ``sudo -u www-data php occ app:list``
        from within your instance's installation folder
      render: Text
  - type: textarea
    id: config
    attributes:
      label: Nextcloud configuration
      description: |
        Provide information about your configuration.
        ``sudo -u www-data php occ config:list system``
        from within your instance's installation folder.
      render: Text
  - type: markdown
    attributes:
      value: "## Logs"
  - type: textarea
    id: log
    attributes:
      label: Web server error log
      description: |
        Insert your webserver log here
      render: Text
  - type: textarea
    id: log-file
    attributes:
      label: Log file
      description: |
        Insert your nextcloud.log file here
      render: Text
  - type: textarea
    id: browser-log
    attributes:
      label: Browser log
      description: |
        Insert your browser log here, this could for example include:
        a) The javascript console log
        b) The network log
        c) ...
      render: Text
  - type: textarea
    id: additional-info
    attributes:
      label: Additional info
      description: Any additional information related to the issue (ex. browser console errors, software versions).
